name: B197 S4D feedback-active RTL test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/B197_S4D_feedback_functional_gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fixed-point feedback recurrence with unchanged original RTL
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p raw_logs upstream
          exec > >(tee raw_logs/full.log) 2>&1
          trap 'rc=$?; echo "B197_FEEDBACK_SIM_EXIT=$rc"; date -u -Is' EXIT
          date -u -Is
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iverilog
          iverilog -V 2>&1 | head -8
          git clone --filter=blob:none --no-checkout https://github.com/D1nDo/S4_Silicon_ZCU104.git upstream/S4D
          git -C upstream/S4D checkout --detach bf6c7f0344349803a2ff197a23bbac9dab6669dd
          cp upstream/S4D/new/s4d_biquad_unit.v raw_logs/original_s4d_biquad_unit.v
          cp upstream/S4D/LICENSE raw_logs/upstream_LICENSE
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('raw_logs/original_s4d_biquad_unit.v').read_bytes()
          gitsha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert gitsha=='56d109a83c2a0a29baed44a02c3e669a4d8ee708',gitsha
          print('B197_PINNED_SOURCE_PASS',gitsha)
          PY
          cat >raw_logs/tb_s4d_feedback.v <<'V'
          module tb_s4d_feedback;
            reg clk=0,rst_n=0,cfg_we=0,cfgd_we=0,start=0,clr=0;
            reg [6:0] cfg_addr=0;
            reg [79:0] cfg_data=0;
            reg [1:0] cfgd_addr=0;
            reg signed [15:0] cfgd_data=0;
            reg [4:0] cfgd_bsh=7;
            reg [63:0] u_vec=64'h0100010001000100;
            wire busy,out_valid,ovf;
            wire signed [39:0] out_acc;
            integer idx,frame,cycle,nout,expected,expected_s1,channel;
            s4d_biquad_unit #(.NCH(4),.MODES(32),.LOG2_NB(7),.LOG2_MOD(5),.LOG2_CH(2))
            dut(.clk(clk),.rst_n(rst_n),.cfg_we(cfg_we),.cfg_addr(cfg_addr),
              .cfg_data(cfg_data),.cfgd_we(cfgd_we),.cfgd_addr(cfgd_addr),
              .cfgd_data(cfgd_data),.cfgd_bsh(cfgd_bsh),.start(start),.clr(clr),
              .u_vec(u_vec),.busy(busy),.out_valid(out_valid),.out_acc(out_acc),.ovf(ovf));
            always #5 clk=~clk;
            initial begin
              repeat(4) @(negedge clk); rst_n=1;
              // Mode 0 of each channel: b0=128, a1=1<<22 (exact 1.0), b1=a2=0.
              // Other 31 modes per channel are zero.
              for(idx=0;idx<128;idx=idx+1) begin
                @(negedge clk); cfg_we=1; cfg_addr=idx;
                cfg_data=(idx%32==0)?((80'd128 << 48) | 80'd4194304):80'd0;
              end
              @(negedge clk); cfg_we=0;
              for(idx=0;idx<4;idx=idx+1) begin
                @(negedge clk); cfgd_we=1; cfgd_addr=idx; cfgd_data=0; cfgd_bsh=7;
              end
              @(negedge clk); cfgd_we=0;
              for(frame=0;frame<3;frame=frame+1) begin
                @(negedge clk); start=1; clr=(frame==0);
                @(negedge clk); start=0; clr=0; nout=0;
                expected=(frame%2==0)?256:0;
                expected_s1=(frame%2==0)?-256:0;
                for(cycle=0;cycle<180;cycle=cycle+1) begin
                  @(negedge clk);
                  if(out_valid) begin
                    if(out_acc !== expected) $fatal(1,"OUTPUT_MISMATCH frame=%0d channel=%0d got=%0d expected=%0d",frame,nout,out_acc,expected);
                    nout=nout+1;
                  end
                  if(ovf !== 1'b0) $fatal(1,"UNEXPECTED_OVERFLOW frame=%0d",frame);
                end
                if(nout!=4) $fatal(1,"OUTPUT_COUNT frame=%0d got=%0d",frame,nout);
                if(busy !== 1'b0) $fatal(1,"BUSY_NOT_CLEARED frame=%0d",frame);
                for(channel=0;channel<4;channel=channel+1) begin
                  if(dut.state1[channel*32] !== expected_s1)
                    $fatal(1,"STATE1_MISMATCH frame=%0d ch=%0d got=%0d expected=%0d",frame,channel,$signed(dut.state1[channel*32]),expected_s1);
                  if(dut.state2[channel*32] !== 32'sd0)
                    $fatal(1,"STATE2_MISMATCH frame=%0d ch=%0d",frame,channel);
                end
                $display("B197_FRAME_PASS frame=%0d outputs=%0d expected_y=%0d expected_s1=%0d",frame,nout,expected,expected_s1);
              end
              $display("B197_S4D_FEEDBACK_ACTIVE_PASS frames=3 channels=4 modes=32");
              $finish;
            end
          endmodule
          V
          sha256sum raw_logs/original_s4d_biquad_unit.v raw_logs/tb_s4d_feedback.v > raw_logs/source_sha256.txt
          iverilog -g2012 -s tb_s4d_feedback -o raw_logs/tb.vvp raw_logs/original_s4d_biquad_unit.v raw_logs/tb_s4d_feedback.v
          timeout 20s vvp raw_logs/tb.vvp 2>&1 | tee raw_logs/sim.log
          grep -q '^B197_S4D_FEEDBACK_ACTIVE_PASS' raw_logs/sim.log
      - name: Preserve receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B197-S4D-feedback-active-RTL
          path: raw_logs/
          retention-days: 8
          if-no-files-found: warn
