name: B197 R9 pinned Mamba3 native kernel and strict golden
on:
  push:
    branches: [main]
    paths: ['.github/workflows/B197_R9_Mamba3_native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-kernel-csim:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Pin public source, compile native Mamba3, test all 640 golden steps
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p B197_R9_logs/build
          exec > >(tee B197_R9_logs/full.log) 2>&1
          trap 'rc=$?; echo "B197_R9_NATIVE_CI_EXIT=$rc"; date -u -Is' EXIT
          echo 'B197_R9_SCOPE=NATIVE_CPP_FP32_MAMBA3_KRIA_SOURCE_NONVENDOR_SIM_NO_FPGA_PPA'
          date -u -Is; uname -a
          g++ --version | head -1
          git clone --filter=blob:none --no-checkout https://github.com/rohitmandapati/mamba3-hls.git upstream
          git -C upstream checkout --detach a380d1b8ccc503fe42459056d3627201d101927d
          test "$(git -C upstream rev-parse HEAD)" = a380d1b8ccc503fe42459056d3627201d101927d
          test -f upstream/src/hls/hls_stream.h
          test -d upstream/src/hls/data/seq_9/step_63
          test -f upstream/src/hls/data/seq_9/golden_state_out.bin
          git -C upstream status --porcelain >B197_R9_logs/upstream_status.txt
          test ! -s B197_R9_logs/upstream_status.txt
          sha256sum upstream/src/hls/mamba3_step.cpp upstream/src/hls/mamba3_step_test.cpp upstream/src/hls/hls_stream.h upstream/src/hls/model_config.h upstream/src/hls/ssm_ops.h upstream/src/hls/typedefs.h upstream/README.md > B197_R9_logs/upstream_hashes.txt
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          base=Path('upstream/src/hls')
          a=(base/'mamba3_step_test.cpp').read_text()
          needle='const float threshold = 5e-1f;'
          assert a.count(needle)==1
          changed=a.replace(needle,'const float threshold = 1e-4f;')
          Path('B197_R9_logs/build/strict_tb.cpp').write_text(changed)
          info={'pinned_commit':'a380d1b8ccc503fe42459056d3627201d101927d','original_tb_sha256':hashlib.sha256(a.encode()).hexdigest(),'strict_tb_sha256':hashlib.sha256(changed.encode()).hexdigest(),'single_semantic_change':'testbench pass threshold 0.5 -> 0.0001','original_dut_unchanged':True,'native_no_Vitis':True,'hardware_PPA':False}
          Path('B197_R9_logs/testbench_delta.json').write_text(json.dumps(info,indent=2))
          print('B197_R9_STRICT_TESTBENCH_PINNED',json.dumps(info))
          PY
          INC="-Iupstream/src/hls"
          FLAGS="-O2 -std=c++17 -Wno-unknown-pragmas -DMAMBA3_NSTEPS=64 -DMAMBA3_USE_FIXED_POINT=0 -DMAMBA3_FORCE_XILINX_HEADERS=0"
          echo "Build baseline $FLAGS"
          g++ $FLAGS $INC -DMAMBA3_ENABLE_HLS_PRAGMAS=0 upstream/src/hls/mamba3_step.cpp B197_R9_logs/build/strict_tb.cpp -lm -o B197_R9_logs/build/baseline_strict
          echo "Build pragma $FLAGS"
          g++ $FLAGS $INC -DMAMBA3_ENABLE_HLS_PRAGMAS=1 upstream/src/hls/mamba3_step.cpp B197_R9_logs/build/strict_tb.cpp -lm -o B197_R9_logs/build/pragma_strict
          python3 - <<'PY'
          from pathlib import Path
          import os
          print("B197_R9_GOLDEN_SEQ_COUNT",len(list(Path('upstream/src/hls/data').glob('seq_*/step_0/x.bin'))))
          print("B197_R9_GOLDEN_STEP63_PRESENT",len(list(Path('upstream/src/hls/data').glob('seq_*/step_63/x.bin'))))
          PY
          # The original testbench loads data relative to working directory.
          # Symbolic links are runtime local; not uploaded as derivative upstream files.
          ln -s upstream/src/hls/data data
          timeout 210s B197_R9_logs/build/baseline_strict > B197_R9_logs/baseline_strict.log 2>&1
          timeout 210s B197_R9_logs/build/pragma_strict > B197_R9_logs/pragma_strict.log 2>&1
          tail -12 B197_R9_logs/baseline_strict.log
          tail -12 B197_R9_logs/pragma_strict.log
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          results={}
          pat=r'\*\*\* PASS \*\*\* \(threshold=([0-9eE+.-]+), (\d+) sequence\(s\) x (\d+) step\(s\) verified\)'
          for v in ('baseline','pragma'):
              l=Path('B197_R9_logs/'+v+'_strict.log').read_text(errors='replace')
              m=re.search(pat,l)
              assert m is not None,(v,l[-600:])
              assert int(m.group(2))==10 and int(m.group(3))==64,(v,m.groups())
              def nums(label):
                  match=re.search(label+r' max / mean / rmse:\s+([0-9.eE+-]+) / ([0-9.eE+-]+) / ([0-9.eE+-]+)',l)
                  assert match is not None,(v,label)
                  return [float(s) for s in match.groups()]
              state=nums('state_out')
              out=nums('out       ')
              assert state[0]<1e-4 and out[0]<1e-4
              assert len(re.findall(r'  Seq \d+ Step \d+ \| out max err:',l))==640
              results[v]={'independent_640_step_native_cpp_PASS':True,'state_max_mean_rmse':state,'out_max_mean_rmse':out,'checked_outputs':10*64*256,'checked_final_states':10*8192}
          summary={'gate':'MAMBA3_NATIVE_CXX_STRICT_1E-4_PASS_NO_FPGA_PPA','source_commit':'a380d1b8ccc503fe42459056d3627201d101927d','source_license':'NO_EXPLICIT_LICENSE; upstream code not redistributed','testbench_modified_only_threshold':True,'comparisons':results}
          Path('B197_R9_logs/R9_native_summary.json').write_text(json.dumps(summary,indent=2))
          print('B197_R9_640_GOLDEN_NATIVE_PASS',json.dumps(summary))
          PY
          sha256sum B197_R9_logs/R9_native_summary.json B197_R9_logs/baseline_strict.log B197_R9_logs/pragma_strict.log >B197_R9_logs/results_sha256.txt
      - name: Preserve run logs and provenance only, not third-party source, model or golden vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B197-R9-Mamba3-native-640-steps
          path: |
            B197_R9_logs/*.log
            B197_R9_logs/*.txt
            B197_R9_logs/*.json
          retention-days: 7
          if-no-files-found: warn
